name: CI
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
jobs:
  ci:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup WSL
        uses: Particular/setup-wsl-action@v1.2.0
      - name: Setup MySQL
        uses: ./
        with:
          connection-string-name: MySQLConnectionString
          init-script: .github/workflows/scripts/init-test.sql
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Validate mysql shim
        shell: pwsh
        run: |
          # The init script creates shim_test with a known password, so the shim
          # can be exercised without access to the generated connection-string password.
          $result = (mysql --user=shim_test --password=shim_pass --database=init_test --batch --skip-column-names --execute="SELECT COUNT(*) FROM round_trip")
          if ($LASTEXITCODE -ne 0) {
            throw "mysql shim failed with exit code $LASTEXITCODE"
          }
          Write-Host "Rows in init_test.round_trip: $result"
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Test
        shell: pwsh
        run: dotnet test src/tests --configuration Release
